<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030611">
  <meta name="description" content="MOKU Digital AI Voice. A calm space to think out loud.">
  <title>MOKU Digital AI Voice</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23050920'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%237991ff' stroke-width='5'/%3E%3Cpath d='M15 32a17 17 0 0 1 29-12' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=3">
  <script src="vendor/livekit-client.umd.js?v=2.19.2"></script>
</head>
<body data-state="idle">
  <div class="atmosphere" aria-hidden="true"><div class="horizon"></div><div class="wash"></div></div>
  <header class="topbar">
    <div class="top-actions"><span class="preview-label" hidden>Design preview</span><button class="icon-button" id="preview-toggle" aria-label="Explore animation states" aria-haspopup="dialog" hidden><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg></button></div>
  </header>
  <main class="experience">
    <section class="presence" aria-label="Voice assistant">
      <div class="orb-wrap"><canvas id="orb" aria-hidden="true"></canvas></div>
      <div class="status" id="status" role="status"><span class="status-spark" aria-hidden="true"></span><span id="status-text">Here with you</span><span class="think-dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
      <div class="intro" id="intro"><p class="greeting">MOKU Digital</p><h1>What's on<br>your mind?</h1></div>
      <section id="conversation" class="conversation" aria-label="Conversation" hidden><div id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div></section>
    </section>
    <div class="composer-area">
      <div class="notice" id="notice" role="status" hidden></div>
      <div class="session-actions" id="session-actions" hidden><button id="mute" class="text-button">Mute microphone</button><span aria-hidden="true">·</span><button id="end" class="text-button">End session</button></div>
      <div class="suggestions" id="suggestions"><button data-prompt="Help me explore an idea">Explore an idea <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 12.5 12 4m0 0H5m7 0v7"/></svg></button><button data-prompt="Help me find some clarity">Find some clarity <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 12.5 12 4m0 0H5m7 0v7"/></svg></button></div>
      <form class="glass-dock" id="composer" autocomplete="off">
        <span class="input-star" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3c0 6-3 9-9 9 6 0 9 3 9 9 0-6 3-9 9-9-6 0-9-3-9-9Z"/></svg></span>
        <label class="sr-only" for="message">Your message</label><input id="message" name="message" maxlength="2000" placeholder="Ask anything…" aria-describedby="input-hint">
        <button class="send-button" id="send" type="submit" aria-label="Send message" hidden><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
        <span class="dock-divider" aria-hidden="true"></span>
        <button class="voice-button" id="voice" type="button" aria-label="Start microphone" aria-pressed="false"><svg class="wave-icon" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M3 11v6M8.5 6v16M14 2v24M19.5 7v14M25 11v6"/></svg></button>
      </form>
      <div class="dock-caption"><span id="input-hint">Type a thought. Or just start talking.</span><button class="text-button" id="new-chat" hidden>New conversation</button></div>
      <p class="demo-caption" hidden>Interactive prototype · Sample responses</p>
    </div>
  </main>
  <dialog id="preview-panel" class="preview-panel" aria-labelledby="preview-title" hidden>
    <div class="panel-heading"><div><p class="eyebrow">FEEL THE CONVERSATION</p><h2 id="preview-title">Explore the states</h2></div><button class="icon-button" id="close-preview" aria-label="Close state preview"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div>
    <p class="panel-description">A different rhythm for every moment.</p>
    <div class="state-grid" id="state-grid"></div>
    <div class="panel-footer"><span>Animation preview only</span><button class="text-button" id="reset-state">Reset to idle</button></div>
  </dialog>
  <script src="app.js?v=13"></script>
</body>
</html>
