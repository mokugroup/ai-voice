services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./livekit.yaml:/livekit/livekit.yaml:ro
    command: --config /livekit/livekit.yaml

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - livekit
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    network_mode: host
    env_file: .env
    depends_on:
      - livekit
